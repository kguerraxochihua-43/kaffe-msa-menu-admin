server.port=${PORT:8086}
kaffe.datasource.url=${DB_URL:${DATABASE_URL}}
kaffe.datasource.username=${DB_USERNAME:${DB_USER}}
kaffe.datasource.password=${DB_PASSWORD}
kaffe.datasource.maximum-pool-size=${DB_POOL_SIZE:20}
kaffe.datasource.minimum-idle=${DB_POOL_MIN_IDLE:4}
kaffe.jwt.secret=${JWT_SECRET}
kaffe.jwt.cookie-name=${JWT_COOKIE_NAME:KAFFE_AUTH}
