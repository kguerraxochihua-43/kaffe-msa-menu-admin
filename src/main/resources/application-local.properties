server.port=${PORT:8086}
kaffe.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kaffe_dev}
kaffe.datasource.username=${DB_USERNAME:postgres}
kaffe.datasource.password=${DB_PASSWORD:postgres}
kaffe.jwt.secret=kaffe-local-dev-secret-change-me
kaffe.jwt.cookie-name=${JWT_COOKIE_NAME:KAFFE_AUTH}
spring.devtools.restart.enabled=${SPRING_DEVTOOLS_RESTART_ENABLED:true}
spring.devtools.livereload.enabled=${SPRING_DEVTOOLS_LIVERELOAD_ENABLED:true}
spring.devtools.restart.poll-interval=${SPRING_DEVTOOLS_POLL_INTERVAL:2s}
spring.devtools.restart.quiet-period=${SPRING_DEVTOOLS_QUIET_PERIOD:1s}
