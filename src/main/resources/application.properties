spring.application.name=kaffe-msa-menu-admin
server.port=${PORT:8086}

kaffe.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/kaffe_dev}
kaffe.datasource.username=${DB_USERNAME:postgres}
kaffe.datasource.password=${DB_PASSWORD:postgres}
kaffe.datasource.driver-class-name=org.postgresql.Driver
kaffe.datasource.maximum-pool-size=${DB_POOL_SIZE:2}
kaffe.datasource.minimum-idle=${DB_POOL_MIN_IDLE:0}

spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

kaffe.jwt.secret=${JWT_SECRET:kaffe-local-dev-secret-change-me}
kaffe.jwt.cookie-name=${JWT_COOKIE_NAME:KAFFE_AUTH}

kaffe.media.enabled=${KAFFE_MEDIA_ENABLED:true}
kaffe.media.max-upload-bytes=${KAFFE_MEDIA_MAX_UPLOAD_BYTES:5242880}
kaffe.media.upload-ttl=${KAFFE_MEDIA_UPLOAD_TTL:15m}
kaffe.media.allow-svg=${KAFFE_MEDIA_ALLOW_SVG:false}
kaffe.media.s3.bucket=${KAFFE_MEDIA_S3_BUCKET:}
kaffe.media.s3.region=${KAFFE_MEDIA_S3_REGION:${AWS_REGION:us-east-1}}
kaffe.media.s3.public-base-url=${KAFFE_MEDIA_PUBLIC_BASE_URL:}
kaffe.media.s3.key-prefix=${KAFFE_MEDIA_S3_KEY_PREFIX:}
